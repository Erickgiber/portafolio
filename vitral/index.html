<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/vitral/icon.png" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.remove("dark");
          }
          const lang = localStorage.getItem("portfolio_lang");
          if (lang === "es" || lang === "en") {
            document.documentElement.lang = lang;
          }
        } catch (e) {}
      })();
    </script>

    <title>Vitral | Tu PC como una consola</title>
    <meta
      name="description"
      content="Vitral convierte tu PC con Windows en una consola: una pantalla de inicio para el mando, una guía sobre cualquier juego, capturas, grabación y amigos. Descárgalo aquí."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/vitral/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vitral | Tu PC como una consola" />
    <meta
      property="og:description"
      content="Una pantalla de inicio para el mando, una guía sobre cualquier juego, capturas, grabación y amigos."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/vitral/" />
    <meta property="og:image" content="%VITE_SITE_URL%/vitral/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/vitral/og.jpg" />
    <meta name="theme-color" content="#080c14" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
