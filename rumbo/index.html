<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/rumbo/icon.png" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.remove("dark");
          }
          const lang = localStorage.getItem("portfolio_lang");
          if (lang === "es" || lang === "en") {
            document.documentElement.lang = lang;
          }
        } catch (e) {}
      })();
    </script>

    <title>Rumbo | Proton VPN solo para los sitios que elijas</title>
    <meta
      name="description"
      content="Rumbo usa el proxy de Proton VPN solo para los sitios que elijas, desde la bandeja de Windows: se activa con un clic, se inicia con el equipo y se actualiza solo. Descárgalo gratis."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/rumbo/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rumbo | Proton VPN solo para los sitios que elijas" />

      property="og:description"
      content="El proxy de Proton VPN, solo para los sitios que elijas y sin convertir tu PC en una VPN completa."
