    <!-- Script síncrono anti-parpadeo: Inicializa en Dark Mode por defecto si no hay preferencia light guardada -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("theme");
          if (theme === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
          const lang = localStorage.getItem("portfolio_lang");
          if (lang === "es" || lang === "en") {
            document.documentElement.lang = lang;
          }
        } catch (e) {}
      })();
    </script>

    <!-- Dynamic URL Safety Fallback for all Social Crawlers -->
    <script>
      (function () {
        const base = window.location.origin + window.location.pathname;
        const origin = window.location.origin;

        const canonical = document.querySelector('link[rel="canonical"]');
        if (
          canonical &&
          (!canonical.getAttribute("href") ||
            canonical.getAttribute("href").indexOf("%VITE_SITE_URL%") !== -1)
        ) {
          canonical.setAttribute("href", base);
        }

        const ogUrl = document.querySelector('meta[property="og:url"]');
        if (
          ogUrl &&
          (!ogUrl.getAttribute("content") ||
            ogUrl.getAttribute("content").indexOf("%VITE_SITE_URL%") !== -1)
        ) {
          ogUrl.setAttribute("content", base);
        }

        const ogImg = document.querySelector('meta[property="og:image"]');
        if (
          ogImg &&
          (!ogImg.getAttribute("content") ||
            ogImg.getAttribute("content").indexOf("%VITE_SITE_URL%") !== -1)
        ) {
          ogImg.setAttribute("content", origin + "/erick-ramirez.jpg");
        }

        const ogImgSec = document.querySelector('meta[property="og:image:secure_url"]');
        if (
          ogImgSec &&
          (!ogImgSec.getAttribute("content") ||
            ogImgSec.getAttribute("content").indexOf("%VITE_SITE_URL%") !== -1)
        ) {
          ogImgSec.setAttribute("content", origin + "/erick-ramirez.jpg");
        }

        const imgRel = document.querySelector('link[rel="image_src"]');
        if (
          imgRel &&
          (!imgRel.getAttribute("href") ||
            imgRel.getAttribute("href").indexOf("%VITE_SITE_URL%") !== -1)
        ) {
          imgRel.setAttribute("href", origin + "/erick-ramirez.jpg");
        }

        const twUrl = document.querySelector('meta[name="twitter:url"]');
        if (
          twUrl &&
          (!twUrl.getAttribute("content") ||
            twUrl.getAttribute("content").indexOf("%VITE_SITE_URL%") !== -1)

          twUrl.setAttribute("content", base);
        }

        const twImg = document.querySelector('meta[name="twitter:image"]');

            twImg.getAttribute("content").indexOf("%VITE_SITE_URL%") !== -1)
        ) {
          twImg.setAttribute("content", origin + "/erick-ramirez.jpg");
        }
      })();
